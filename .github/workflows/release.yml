name: Release

# Builds the package on a v* tag, verifies it installs and runs on all three
# OSes, signs build provenance (SLSA, via Sigstore), and publishes a GitHub
# release with the wheel, sdist and a SHA256SUMS file. A pull request that
# touches the release machinery runs the same build and verify as a dry run,
# so the workflow itself is tested before a tag depends on it.

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/release_notes.py
      - .github/scripts/check_wheel.py
      - .github/scripts/check_installed.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: Build and gate the release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      is_tag: ${{ steps.mode.outputs.is_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # need tags and origin/main to check the tag's commit
      - name: Decide release vs dry run
        id: mode
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Require the tag's commit to be on main
        if: steps.mode.outputs.is_tag == 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} points at $GITHUB_SHA, which is not on origin/main"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} commit is on main"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install pinned build tools
        run: python -m pip install --require-hashes -r .github/requirements/tools.txt
      - name: Gate the release and extract notes
        if: steps.mode.outputs.is_tag == 'true'
        run: python .github/scripts/release_notes.py "${GITHUB_REF_NAME}" --out "$RUNNER_TEMP/notes.md"
      - name: Check release_notes gate runs (dry run)
        if: steps.mode.outputs.is_tag != 'true'
        # Can't assert success — the CHANGELOG may still say Unreleased — but
        # the script must at least import and parse without crashing.
        run: python .github/scripts/release_notes.py v0.0.0 || true
      - name: Build sdist and wheel
        run: python -m build
      - name: Check package metadata
        run: twine check --strict dist/*
      - name: Check the wheel and sdist ship every bundled file
        run: python .github/scripts/check_wheel.py dist
      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Keep the built distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Keep the release notes
        if: steps.mode.outputs.is_tag == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify the wheel (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Install the wheel into a clean venv and run it from outside the repo
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$RUNNER_TEMP/venv/Scripts"; else BIN="$RUNNER_TEMP/venv/bin"; fi
          "$BIN/python" -m pip install --require-hashes -r .github/requirements/test-py312.txt
          "$BIN/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$BIN/python" "$GITHUB_WORKSPACE/.github/scripts/check_installed.py" "$BIN/scaffold"
          "$BIN/scaffold" --version

  publish:
    name: Attest provenance and publish the release
    needs: [build, verify]
    if: needs.build.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub release
      id-token: write # mint the Sigstore signing certificate
      attestations: write # record the provenance attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes
      - name: Attest build provenance for the wheel and sdist
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file notes/notes.md \
            --verify-tag \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS
