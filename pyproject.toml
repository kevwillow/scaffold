[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scaffold-gui"
version = "2.13.1"
description = "Schema-driven GUI generator for any CLI tool"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kev" }]
requires-python = ">=3.10"
dependencies = [
    # PySide6 6.12.0 drops a reference to None/True on every signal delivered
    # to a Python slot (PYSIDE-3477), which aborts the interpreter on Python
    # 3.11 and older. 3.12+ is immune because those objects are immortal there.
    "PySide6>=6.5,<6.12; python_version < '3.12'",
    "PySide6>=6.5; python_version >= '3.12'",
]
keywords = ["cli", "gui", "wrapper", "schema", "pyside6", "qt", "security"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/kevwillow/scaffold"
Repository = "https://github.com/kevwillow/scaffold"
Changelog = "https://github.com/kevwillow/scaffold/blob/main/CHANGELOG.md"

[project.scripts]
scaffold = "scaffold:main"

[tool.setuptools]
py-modules = ["scaffold"]

[tool.setuptools.packages.find]
include = ["scaffold_data*"]

[tool.setuptools.package-data]
scaffold_data = ["**/*.json", "**/*.txt", "**/*.md"]
