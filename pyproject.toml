[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scaffold-gui"
version = "2.13.2"
description = "Schema-driven GUI generator for any CLI tool"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kev" }]
requires-python = ">=3.10"
dependencies = [
    # PySide6 6.12.0 drops a reference to None/True on every signal delivered
    # to a Python slot (PYSIDE-3477), which aborts the interpreter on Python
    # 3.11 and older. 3.12+ is immune because those objects are immortal there.
    "PySide6>=6.5,<6.12; python_version < '3.12'",
    "PySide6>=6.5; python_version >= '3.12'",
]
keywords = ["cli", "gui", "wrapper", "schema", "pyside6", "qt", "security"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/kevwillow/scaffold"
Repository = "https://github.com/kevwillow/scaffold"
Changelog = "https://github.com/kevwillow/scaffold/blob/main/CHANGELOG.md"

[project.scripts]
scaffold = "scaffold:main"

[tool.setuptools]
py-modules = ["scaffold"]

[tool.setuptools.packages.find]
include = ["scaffold_data*"]

[tool.setuptools.package-data]
scaffold_data = ["**/*.json", "**/*.txt", "**/*.md"]

[tool.coverage.run]
# CI's coverage job measures scaffold.py across all six suites, including
# the headless `scaffold.py --run-cascade` subprocesses the suites start
# and the regex capture worker pool.
include = ["scaffold.py"]
branch = true
parallel = true
patch = ["subprocess"]
concurrency = ["thread", "multiprocessing"]
sigterm = true

[tool.coverage.report]
precision = 1
# Conservative floor: the real number from CI is higher. Raise this toward
# the reported total once a green CI run establishes it; it only ratchets up.
fail_under = 55

[tool.mypy]
# CI runs mypy through .github/scripts/check_types.py, which checks
# scaffold.py against Python 3.10 and compares the result with
# .github/mypy-baseline.txt.
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
